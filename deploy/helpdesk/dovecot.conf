# Dovecot: the local IMAP service FreeScout fetches from.
#
# Its entire job is to expose one Maildir, written by the bridge, to one
# client on a private Docker network. It is not a mail server: it does not
# accept SMTP, it does not deliver, it does not route, and it faces nothing
# except FreeScout.
#
# The plan calls for `listen = 127.0.0.1` so IMAP is unreachable from the
# public internet. On this box the container equivalent is stronger: the
# service publishes no host ports and joins only the private `helpdesk_default`
# network, so it is not reachable from the host, from the shared Caddy edge
# network, or from the other four applications -- only from the two containers
# that share that network. Binding 0.0.0.0 inside a container with no published
# ports is not the same thing as binding a public interface.

# No TLS. The connection never leaves a private Docker network, and a
# self-signed certificate here would buy nothing while adding a rotation date
# and a failure mode -- FreeScout would eventually refuse to connect on a
# Sunday for a reason nobody remembers. If this ever moves off-box, that is the
# moment to add it, not before.
ssl = no
disable_plaintext_auth = no

protocols = imap
listen = *

# The one mailbox. Maildir format because that is what the bridge writes, and
# because its delivery is a rename -- atomic, and safe to do while Dovecot is
# reading the same directory.
mail_location = maildir:/maildir
mail_uid = 1000
mail_gid = 1000

# A static password file rather than system users: this container has no users
# to speak of, and a file is one thing to mount and one thing to rotate.
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/maildir mail=maildir:/maildir allow_all_users=yes
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  # No imaps listener: see the TLS note above.
  inet_listener imaps {
    port = 0
  }
}

# FreeScout polls on a schedule and holds one connection at a time. These are
# generous for that and small enough that a runaway client cannot exhaust the
# container's memory cap.
service imap {
  process_limit = 16
}

namespace inbox {
  inbox = yes
  separator = /
}

# Quiet by default. Mail bodies must never reach a log -- see the plan's
# logging section: ticket contents do not belong in routine logs, and this
# service's logs are the easiest place for them to leak into.
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = no
mail_debug = no
