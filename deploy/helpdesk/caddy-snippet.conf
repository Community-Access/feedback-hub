# Add this as a NEW top-level site block in /home/jeffbis/app/web/Caddyfile.
#
# A block of its own, not a path inside an existing one: FreeScout is a whole
# application at the root of a hostname. It builds absolute URLs from its own
# SITE_URL and would fight any prefix stripping.
#
# ---------------------------------------------------------------------------
# DO NOT ADD THIS UNTIL DNS RESOLVES.
#
#   helpdesk.community-access.org.  A  107.175.91.158
#
# Caddy asks Let's Encrypt for a certificate the moment it loads a site block,
# and Let's Encrypt answers by connecting to whatever the name resolves to. For
# a name that resolves to nothing, that is a failed validation -- and failed
# validations are rate limited far more tightly than successful ones (5 per
# hostname per hour). Adding the block early does not "queue it up"; it spends
# the budget you will want when the record is real.
#
# Verify first, then add, then reload:
#
#   dig +short helpdesk.community-access.org        # must print 107.175.91.158
#   cd ~/app/web
#   cp Caddyfile Caddyfile.bak.$(date +%F)
#   nano Caddyfile                                   # paste the block below
#   docker compose -f docker-compose.prod.yml exec -T caddy \
#       caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
#   docker compose -f docker-compose.prod.yml exec -T caddy \
#       caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
#
# reload, never restart: the same Caddy fronts four other production
# applications and a reload swaps the config without dropping a connection.
# ---------------------------------------------------------------------------

helpdesk.community-access.org {
	# FreeScout sets its own Content-Security-Policy and cookie flags, so Caddy
	# adds only the transport-level and policy headers that do not depend on
	# application state.
	header {
		Strict-Transport-Security "max-age=63072000; includeSubDomains"
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Permissions-Policy "geolocation=(), microphone=(), camera=()"
	}

	# Attachments. FreeScout's own limit is set in its interface; this is the
	# proxy's, and the smaller of the two is the one that wins -- silently, and
	# with an error that blames the wrong component.
	request_body {
		max_size 25MB
	}

	reverse_proxy helpdesk-app:80 {
		# Without X-Forwarded-Proto, FreeScout builds every absolute URL as
		# http:// -- so the login POST leaves an https page for an http one, the
		# browser refuses it as mixed content, and sign-in fails with nothing
		# in any log that names the cause. Caddy sets this by default; it is
		# written out because the container is configured to trust it
		# (ENABLE_SSL_PROXY=TRUE) and the two have to agree.
		header_up X-Forwarded-Proto {scheme}

		# Long enough for a mailbox fetch or a module install to finish. The
		# default 0 (no timeout) is fine too; this is a deliberate ceiling so a
		# wedged request cannot hold a connection open forever.
		transport http {
			response_header_timeout 120s
		}
	}

	encode {
		gzip
		match {
			header Content-Type text/html*
			header Content-Type text/plain*
			header Content-Type text/css*
			header Content-Type application/json*
			header Content-Type application/javascript*
			header Content-Type image/svg+xml*
		}
	}

	log {
		output file /data/helpdesk-access.log {
			roll_size 10MB
			roll_keep 5
		}
	}
}
