# Paste this into the `lp.csedesigns.com, glow.bits-acb.org, www.letitglow.app`
# site block in /home/jeffbis/app/web/Caddyfile, ABOVE the `redir` line.
#
# Above the redir, because that block ends with a permanent redirect of
# everything to letitglow.app. A 301 sitting in front of this endpoint would
# not merely be untidy: the browser would follow it to a different origin, the
# CORS check would then be made against an origin the server does not allow,
# and the form would fail in a way that looks exactly like the server being
# down. The existing /ggg* handler is above the redir for the same reason.
#
# `handle`, not `handle_path`. handle_path strips the matched prefix, so
# /submit/picks would arrive at the app as /picks and 404 against its own
# configured PICKS_PATH. Leaving the path intact means the URL the page posts
# to and the path the app answers on are the same string, which is one fewer
# thing to get wrong at 2am.
#
# The named matcher pins this to lp.csedesigns.com alone. The site block covers
# three hostnames, and the submission endpoint has no business answering on
# glow.bits-acb.org or www.letitglow.app.

	@picks_submit {
		host lp.csedesigns.com
		path /submit/*
	}
	handle @picks_submit {
		reverse_proxy feedback-hub-submit:8095
	}
